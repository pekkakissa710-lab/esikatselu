<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sivua ei löytynyt | Sakset & Kärki</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #111;
      font-family: "Fredoka", sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 25px;
      max-width: 1200px;
      width: 100%;
      margin: auto;
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px 100px;
    }

    .error {
      max-width: 800px;
    }

    .question {
      font-size: clamp(180px, 35vw, 390px);
      line-height: .65;
      font-weight: 700;
      letter-spacing: -20px;
      margin: 0 0 55px;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 65px);
      font-weight: 600;
    }

    p {
      margin: 15px 0 30px;
      color: #777;
      font-size: 18px;
    }

    .button {
      display: inline-block;
      background: #111;
      color: #fff;
      text-decoration: none;
      padding: 15px 25px;
      border-radius: 30px;
      font-size: 17px;
      transition: .2s ease;
    }

    .button:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
    }

    .button:active {
      transform: scale(.96);
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-12px) rotate(2deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .question {
        animation: none;
      }

      .button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Sakset & Kärki</div>
  </header>

  <main>
    <div class="error">

      <div class="question">?</div>

      <h1>Sivua ei löytynyt</h1>

      <p>
        Taisit eksyä väärälle sivulle.
      </p>

      <a class="button" href="/">
        ← Takaisin kotisivulle
      </a>

    </div>
  </main>

  <footer>
    Sakset & Kärki
  </footer>

</body>
</html>
